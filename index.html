<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio 2.0 de Agustin Meza con React, TypeScript, interfaces cuidadas y una estructura lista para desplegar en Vercel."
    />
    <meta name="theme-color" content="#090813" />
    <script>
      (() => {
        const storageKey = 'portfolio-theme'
        const storedTheme = window.localStorage.getItem(storageKey)
        const theme = storedTheme === 'light' ? 'light' : 'dark'
        const themeColor = theme === 'light' ? '#f6f1ff' : '#090813'

        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', themeColor)
      })()
    </script>
    <title>Portfolio 2.0 | Agustin Meza</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
